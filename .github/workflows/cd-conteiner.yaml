name: Docker Image CICD

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
  
env:
  IMAGEM_CESUSC: ffeller/cesusc-devops

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ffeller
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build and push the Docker image
        run: |
          set -eu
          docker build . --file Dockerfile --tag "$IMAGEM_CESUSC":"${{ github.sha }}"
          docker tag "$IMAGEM_CESUSC":"${{ github.sha }}" "$IMAGEM_CESUSC":latest
          docker push -a "$IMAGEM_CESUSC"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ success() }}
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 15.229.251.117
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGEM_CESUSC
          script: |
            set -eu
            cd /opt/cesusc-devops
            git pull origin main
            docker pull "$IMAGEM_CESUSC":latest
            docker compose down
            docker compose up -d
            docker system prune -a -f
