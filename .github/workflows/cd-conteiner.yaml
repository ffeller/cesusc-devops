name: Docker Image CI

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ffeller
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push the Docker image
        run: |
          docker build . --file Dockerfile --tag ffeller/cesusc-devops:${{ github.sha }}
          docker tag ffeller/cesusc-devops:${{ github.sha }} ffeller/cesusc-devops:latest
          docker push -a ffeller/cesusc-devops

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ success() }}
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0 
        with:
          host: 172.31.44.101
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 2m
          script: |
            cd /opt/cesusc-devops
            git pull origin main
            docker pull ffeller/cesusc-devops:latest
            docker compose down
            docker compose up -d
            docker system prune -a -f
